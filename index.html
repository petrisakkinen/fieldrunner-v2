<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kentt&auml;kiit&auml;j&auml;</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: 'Segoe UI', Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  touch-action: none;
  overscroll-behavior: none;
}
canvas { display: block; touch-action: none; }

#ui {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; display: flex; flex-direction: column; align-items: center;
}

/* ---------- SCOREBOARD (matchday HUD) ---------- */
#scoreboard {
  margin-top: 18px;
  display: flex; align-items: stretch;
  background: linear-gradient(180deg, #181b24 0%, #0e1118 100%);
  border: 3px solid #ffd600;
  border-radius: 12px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.6);
  font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
  letter-spacing: 1.5px;
  color: #fff;
  overflow: hidden;
  user-select: none;
}
.sb-team {
  display: flex; align-items: center; gap: clamp(8px, 1.6vw, 16px);
  padding: clamp(8px, 1.6vw, 16px) clamp(12px, 2.4vw, 28px);
  font-weight: 900;
  font-size: clamp(18px, 3.2vw, 32px);
}
.sb-team.fcb { background: linear-gradient(90deg, #a50044 0%, #004d98 100%); }
.sb-team.rm  { background: linear-gradient(90deg, #1d2238 0%, #2a2f4a 100%); }
.sb-badge {
  width: clamp(28px, 4.4vw, 44px); height: clamp(28px, 4.4vw, 44px); border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: clamp(11px, 1.6vw, 16px); font-weight: 900; letter-spacing: 0;
  background: #fff; color: #111;
  box-shadow: inset 0 0 0 3px #ffd600;
  flex-shrink: 0;
}
.sb-team.rm .sb-badge { background: #fff; color: #111; box-shadow: inset 0 0 0 3px #cccccc; }
.sb-score {
  font-size: clamp(26px, 4.4vw, 44px);
  font-weight: 900;
  min-width: clamp(34px, 6vw, 60px); text-align: center;
  text-shadow: 0 3px 0 rgba(0,0,0,0.45);
  font-variant-numeric: tabular-nums;
}
.sb-center {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: clamp(4px, 0.8vw, 8px) clamp(14px, 3.2vw, 32px);
  background: #0b0d14;
}
.sb-clock {
  font-size: clamp(18px, 3vw, 30px); font-weight: 800; color: #ffd600;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 rgba(0,0,0,0.5);
}
.sb-meta {
  font-size: clamp(9px, 1.3vw, 13px); color: #aab; opacity: 0.9;
  text-transform: uppercase;
  margin-top: 4px;
  letter-spacing: 2px;
  white-space: nowrap;
}
@media (max-width: 600px) {
  #scoreboard { margin-top: max(8px, env(safe-area-inset-top)); }
}

/* ---------- GAME OVER (modern stadium panel) ---------- */
#gameOver {
  display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: min(440px, 88vw);
  background: linear-gradient(180deg, #11141d 0%, #05060a 100%);
  border: 3px solid #ffd600;
  border-radius: 14px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,214,0,0.15);
  text-align: center; color: #fff;
  pointer-events: auto;
  overflow: hidden;
  font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
  letter-spacing: 1px;
}
#gameOver .gameover-banner {
  background: linear-gradient(90deg, #a50044 0%, #004d98 100%);
  color: #ffd600;
  font-size: 14px; font-weight: 900;
  padding: 8px 0;
  text-transform: uppercase; letter-spacing: 4px;
}
#gameOver .gameover-body { padding: 30px 24px 22px; }
#gameOver h1 {
  font-size: 38px; margin: 0 0 6px; color: #ff5566;
  font-weight: 900; text-transform: uppercase;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
#gameOver .final-label {
  font-size: 11px; color: #aab; text-transform: uppercase; letter-spacing: 3px; margin-top: 10px;
}
#gameOver .final-score {
  font-size: 64px; font-weight: 900; color: #ffd600;
  line-height: 1; margin: 4px 0 14px;
  text-shadow: 0 4px 0 rgba(0,0,0,0.5);
  font-variant-numeric: tabular-nums;
}
#gameOver .best-row {
  font-size: 13px; color: #cce; opacity: 0.8;
  margin: 0 0 18px;
  letter-spacing: 2px; text-transform: uppercase;
}
#gameOver .best-row span { color: #ffd600; font-weight: 900; }
#gameOver button {
  padding: 14px 38px; font-size: 16px;
  background: #d6062a; color: #fff;
  border: 2px solid #ffd600; border-radius: 8px;
  cursor: pointer; font-weight: 900;
  letter-spacing: 2px; text-transform: uppercase;
  transition: transform 0.12s, background 0.12s;
}
#gameOver button:hover { background: #b00021; transform: translateY(-1px); }

/* ---------- START SCREEN ---------- */
#startScreen {
  position: fixed; inset: 0; width: 100%; height: 100%;
  background: #0a0a14 url('start_screen.png') center center / contain no-repeat;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 0 0 6vh 0;
  pointer-events: auto; z-index: 50;
}
#startScreen .controls {
  font-size: 14px; margin: 0 0 16px 0; color: #fff;
  background: rgba(0,0,0,0.55); padding: 10px 18px; border-radius: 12px;
  text-align: left; line-height: 1.7; backdrop-filter: blur(4px);
}
#startScreen button {
  padding: 16px 48px; font-size: 22px; background: #d6062a; color: #fff;
  border: 2px solid #ffd600; border-radius: 10px; cursor: pointer; font-weight: 800;
  letter-spacing: 1px; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  text-transform: uppercase;
}
#startScreen button:hover { background: #b00021; transform: translateY(-1px); }
#startScreen.fading { animation: startFade 0.7s ease-in forwards; }
@keyframes startFade { to { opacity: 0; pointer-events: none; } }

#startTransitionVideo {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: contain; background: #000; z-index: 60; display: none;
}

/* ---------- CELEBRATION (dramatic milestone toast) ---------- */
#celebration {
  display: none; position: absolute; top: 18%; left: 50%; transform: translate(-50%,-50%);
  font-size: 56px; font-weight: 900; color: #ffd600; text-align: center;
  letter-spacing: 2px;
  font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
  text-transform: uppercase;
  pointer-events: none; z-index: 10; white-space: nowrap;
  -webkit-text-stroke: 2px #1a0900;
  text-shadow:
    0 0 18px #ff8800,
    0 0 40px #ff4400,
    0 6px 0 rgba(0,0,0,0.6);
  animation: celebPulse 0.6s ease-in-out 3;
}

@keyframes newRecordPulse {
  0% { transform: scale(0.3); opacity: 0; }
  25% { transform: scale(1.2); opacity: 1; }
  50% { transform: scale(0.95); }
  75% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
#newBestScore.animate { animation: newRecordPulse 0.8s ease-out; }
@keyframes celebPulse {
  0% { transform: translate(-50%,-50%) scale(0.5) rotate(-2deg); opacity: 0; }
  30% { transform: translate(-50%,-50%) scale(1.15) rotate(1deg); opacity: 1; }
  60% { transform: translate(-50%,-50%) scale(0.97) rotate(-1deg); }
  100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; }
}
</style>
</head>
<body>

<div id="ui">
  <div id="scoreboard">
    <div class="sb-team fcb">
      <span class="sb-badge">FCB</span>
      <span class="sb-score" id="scoreVal">0</span>
    </div>
    <div class="sb-center">
      <div class="sb-clock" id="matchClock">0:00</div>
      <div class="sb-meta">REPO &middot; #10 &middot; Best: <span id="bestScoreHud">0</span></div>
    </div>
    <div class="sb-team rm">
      <span class="sb-badge">RM</span>
      <span class="sb-score">0</span>
    </div>
  </div>

  <div id="startScreen">
    <div class="controls">
      &#9664; &#9654; &nbsp; Vaihda kaistaa &nbsp;|&nbsp; &#9650; Sy&ouml;tt&ouml; &nbsp;|&nbsp; &#9660; Rainbow flick
    </div>
    <button id="startBtn">Aloita peli</button>
  </div>
  <video id="startTransitionVideo" muted playsinline preload="auto" autoplay></video>
  <div id="celebration"></div>

  <div id="gameOver">
    <div class="gameover-banner">Peli p&auml;&auml;ttyi</div>
    <div class="gameover-body">
      <h1>Final Whistle</h1>
      <div class="final-label">Pisteit&auml;</div>
      <div class="final-score" id="finalScore">0</div>
      <div class="best-row">Paras tulos: <span id="bestScoreEnd">0</span></div>
      <div id="newBestScore" style="display:none;font-size:24px;font-weight:900;color:#ffd600;margin-bottom:16px;text-shadow:0 0 15px #ff8800,0 0 30px #ff4400;letter-spacing:2px;text-transform:uppercase;"></div>
      <button id="restartBtn">Pelaa uudelleen</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
